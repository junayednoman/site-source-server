services:
  mongodb:
    image: mongo:7
    container_name: karan-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    networks:
      - karan-network
    volumes:
      - karan-mongodb-volume:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongodb-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - karan-network
    entrypoint:
      - mongosh
      - --host
      - mongodb:27017
      - --quiet
      - --eval
      - >-
        try { rs.status() } catch (error) {
          rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] })
        }
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karan-server
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5000}
      DATABASE_URL: mongodb://mongodb:27017/karan?replicaSet=rs0&directConnection=true
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    networks:
      - karan-network
    restart: unless-stopped

networks:
  karan-network:
    name: karan-network
    driver: bridge

volumes:
  karan-mongodb-volume:
